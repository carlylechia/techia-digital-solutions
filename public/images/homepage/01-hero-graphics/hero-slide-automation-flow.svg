<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
<title id="title">teChia Automation Hero Graphic</title>
<rect width="1600" height="900" fill="#05070D"/>
<defs>
  <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 260) rotate(45) scale(700)">
    <stop stop-color="#22D3EE" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#05070D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 410) rotate(45) scale(620)">
    <stop stop-color="#8B5CF6" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#05070D" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="line" x1="220" y1="150" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
    <stop stop-color="#2563EB"/>
    <stop offset="0.5" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#g1)"/>
<rect width="1600" height="900" fill="url(#g2)"/>

<g opacity="0.95">
  <rect x="190" y="245" width="310" height="170" rx="30" fill="#07111F" stroke="#2563EB" stroke-opacity="0.7" stroke-width="4"/>
  <rect x="645" y="205" width="310" height="170" rx="30" fill="#07111F" stroke="#22D3EE" stroke-opacity="0.75" stroke-width="4"/>
  <rect x="1100" y="245" width="310" height="170" rx="30" fill="#07111F" stroke="#8B5CF6" stroke-opacity="0.75" stroke-width="4"/>
  <path d="M500 330 H645" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <path d="M955 330 H1100" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="500" cy="330" r="10" fill="#22D3EE"/>
  <circle cx="645" cy="330" r="10" fill="#22D3EE"/>
  <circle cx="955" cy="330" r="10" fill="#22D3EE"/>
  <circle cx="1100" cy="330" r="10" fill="#22D3EE"/>
</g>
